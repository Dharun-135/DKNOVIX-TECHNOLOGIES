<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#18080c"/>
      <stop offset="60" stop-color="#09090c"/>
      <stop offset="100" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff172f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff172f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff612e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Scanning Grid -->
  <g stroke="#ff172f" stroke-opacity="0.1" stroke-width="1">
    <path d="M0 50H800M0 100H800M0 150H800M0 200H800M0 250H800M0 300H800M0 350H800M0 400H800M0 450H800"/>
    <path d="M100 0V500M200 0V500M300 0V500M400 0V500M500 0V500M600 0V500M700 0V500"/>
  </g>

  <!-- Face Wireframe Oval -->
  <ellipse cx="400" cy="240" rx="130" ry="170" fill="none" stroke="#ff172f" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <ellipse cx="400" cy="240" rx="105" ry="145" fill="none" stroke="#ff612e" stroke-width="1.5" opacity="0.4"/>

  <!-- Stage 1: Face Box & Landmarks -->
  <rect x="240" y="80" width="320" height="320" rx="18" fill="none" stroke="#ff172f" stroke-width="2" opacity="0.5"/>
  <path d="M 230 110 L 230 70 L 270 70" fill="none" stroke="#ff172f" stroke-width="3"/>
  <path d="M 570 110 L 570 70 L 530 70" fill="none" stroke="#ff172f" stroke-width="3"/>
  <path d="M 230 370 L 230 410 L 270 410" fill="none" stroke="#ff172f" stroke-width="3"/>
  <path d="M 570 370 L 570 410 L 530 410" fill="none" stroke="#ff172f" stroke-width="3"/>

  <!-- Stage 2: FFT / Frequency Spectrum Waveform -->
  <path d="M 270 240 Q 330 180 400 240 T 530 240" fill="none" stroke="#ff172f" stroke-width="3"/>
  <path d="M 270 240 Q 330 300 400 240 T 530 240" fill="none" stroke="#ff612e" stroke-width="2" opacity="0.7"/>

  <!-- Stage 3: Temporal Motion Buffer Circles -->
  <circle cx="360" cy="210" r="14" fill="none" stroke="#ff172f" stroke-width="2"/>
  <circle cx="440" cy="210" r="14" fill="none" stroke="#ff172f" stroke-width="2"/>
  <circle cx="360" cy="210" r="4" fill="#ff172f"/>
  <circle cx="440" cy="210" r="4" fill="#ff172f"/>

  <!-- Laser Scan Bar -->
  <rect x="220" y="238" width="360" height="4" fill="url(#laser)"/>

  <!-- Status Badges -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#f5f5f5" letter-spacing="2">
    <text x="250" y="60" fill="#ff172f" opacity="0.9">STAGE 1: FAST SCREENING [LAPLACIAN + MOBILENETV3]</text>
    <text x="250" y="440" fill="#ff612e" opacity="0.9">STAGE 2 &amp; 3: FORENSIC FFT + TEMPORAL BUFFER</text>
    <text x="50" y="470" fill="#92929b" font-size="10">PAD STATUS: VERIFIED LIVE</text>
  </g>
</svg>
