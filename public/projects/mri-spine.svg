  <text x="578" y="256" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#ff612e">DEGENERATIVE</text>
  <text x="578" y="276" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#f5f5f5" opacity="0.5">REGION · L4–L5</text>

