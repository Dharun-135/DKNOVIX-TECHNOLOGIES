      <rect x="382" y="374" width="78" height="34" rx="12"/>
      <rect x="392" y="424" width="66" height="30" rx="11"/>
    </g>
    <g fill="#ff2a35" opacity="0.8">
      <circle cx="416" cy="79" r="3.4"/><circle cx="414" cy="129" r="3.4"/><circle cx="412" cy="180" r="3.6"/>
      <circle cx="412" cy="233" r="3.6"/><circle cx="414" cy="287" r="3.6"/><circle cx="418" cy="340" r="3.4"/>
      <circle cx="422" cy="391" r="3.2"/><circle cx="426" cy="439" r="3"/>
    </g>
  </g>

  <!-- scan line + detection box -->
  <rect x="290" y="262" width="250" height="2" fill="url(#scan)" opacity="0.9"/>
  <g stroke="#f5f5f5" stroke-opacity="0.6" stroke-width="1.5" fill="none">
    <path d="M548 246h18v18M566 308v18h-18M330 246h-18v18M312 308v18h18"/>
