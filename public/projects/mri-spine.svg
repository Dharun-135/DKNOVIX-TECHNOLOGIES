<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <radialGradient id="bg" cx="40%" cy="45%" r="80%">
      <stop offset="0" stop-color="#26070d"/>
      <stop offset="0.6" stop-color="#0a0a0d"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff172f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff2a35"/>
      <stop offset="1" stop-color="#ff612e" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="900" height="560" fill="url(#bg)"/>
  <g stroke="#ff172f" stroke-opacity="0.09" stroke-width="1">
