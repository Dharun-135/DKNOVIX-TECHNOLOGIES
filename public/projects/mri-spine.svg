    <path d="M120 0V560M260 0V560M400 0V560M540 0V560M680 0V560M820 0V560"/>
  </g>

  <ellipse cx="380" cy="280" rx="260" ry="230" fill="#ff172f" opacity="0.1" filter="url(#glow)"/>

  <!-- spine column -->
  <g>
    <path d="M420 40c-26 110-26 212 0 300s30 128 6 178" stroke="#ff172f" stroke-opacity="0.4" stroke-width="26" fill="none" filter="url(#glow)"/>
    <g fill="#101015" stroke="#ff3a40" stroke-opacity="0.6" stroke-width="1.6">
      <rect x="378" y="62" width="76" height="34" rx="12"/>
      <rect x="372" y="112" width="84" height="34" rx="12"/>
      <rect x="368" y="162" width="90" height="36" rx="13"/>
      <rect x="366" y="214" width="94" height="38" rx="14"/>
