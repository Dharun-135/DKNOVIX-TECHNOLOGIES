  </g>
  <g>
    <rect x="404" y="372" width="92" height="64" rx="8" fill="#0d0d11" stroke="#ff172f" stroke-opacity="0.55"/>
    <circle cx="450" cy="404" r="17" fill="none" stroke="#ff612e" stroke-width="2.5"/>
    <circle cx="450" cy="404" r="5" fill="#ff2a35"/>
    <path d="M450 421v15" stroke="#ff612e" stroke-width="2"/>
