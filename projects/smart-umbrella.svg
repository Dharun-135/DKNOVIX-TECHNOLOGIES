      <stop offset="0" stop-color="#2a0b11"/>
      <stop offset="0.55" stop-color="#0b0a0d"/>
      <stop offset="1" stop-color="#060607"/>
    </radialGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff612e" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ff172f"/>
      <stop offset="1" stop-color="#6a0a14"/>
