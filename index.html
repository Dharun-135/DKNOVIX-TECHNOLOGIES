<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,10 90,85 10,85' fill='%23050505' stroke='%23FF172F' stroke-width='8'/><circle cx='50' cy='60' r='12' fill='%23FF172F'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DKNOVIX TECHNOLOGIES — Innovating Today. Building Tomorrow.</title>
    <meta name="description" content="Engineering intelligent digital experiences through artificial intelligence, software development, advanced web technologies, and creative innovation." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#050505] text-[#F5F5F5] selection:bg-[#FF172F] selection:text-white antialiased overflow-x-hidden font-sans">
    <!-- Static Netlify Form for build-time detection -->
    <form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="enquiry" />
      <input type="text" name="bot-field" />
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="serviceRequired" />
      <textarea name="projectDescription"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
